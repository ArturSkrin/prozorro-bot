{% extends "base.html" %}{% block title %}Вхід · Prozorro бот{% endblock %}{% block shell %}
<main class="login">
<form method="post">
<input type="hidden" name="csrf" value="{{ csrf() }}">
<div class="brand"><img src="{{ asset('favicon.svg') }}" alt=""><span>Prozorro бот</span></div>
<label>Пароль <input type="password" name="password" autocomplete="current-password" autofocus required></label>
{% if error %}<div class="err" role="alert">{{ error }}</div>{% endif %}
<button class="btn-primary">{{ icon('lock') }}Увійти</button>
</form>
</main>
{% endblock %}
