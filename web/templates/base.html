<!doctype html>
<html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}Prozorro бот{% endblock %}</title>
<style>
:root{--bg:#111418;--panel:#1a1f25;--line:#2a313a;--fg:#d8dee6;--muted:#8b96a3;--acc:#4ea1ff;--ok:#3fb950;--warn:#d29922;--bad:#f85149}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.4 system-ui,sans-serif}
a{color:var(--acc);text-decoration:none}a:hover{text-decoration:underline}
nav{display:flex;gap:16px;align-items:center;padding:8px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
nav b{margin-right:8px}nav form{margin-left:auto}main{padding:12px 16px}
table{border-collapse:collapse;width:100%}th,td{padding:4px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--muted);font-weight:500}.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.muted{color:var(--muted)}.tag{padding:1px 6px;border-radius:4px;background:var(--line);font-size:12px}
.new{color:var(--acc)}.taken{color:var(--ok)}.skip{color:var(--muted)}.err{color:var(--bad)}
input,select,button,textarea{background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:4px;padding:4px 8px;font:inherit}
button{cursor:pointer;background:var(--line)}button:hover{border-color:var(--acc)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}.grid{display:grid;grid-template-columns:220px 1fr;gap:6px 12px;max-width:900px}
pre{background:var(--panel);padding:8px;overflow:auto;max-height:600px}.inline{display:inline}
.wrap{overflow-x:auto}
</style></head><body>
<nav><b>Prozorro бот</b><a href="{{ url_for('found') }}">Знайдено</a><a href="{{ url_for('searches') }}">Пошуки</a>
<a href="{{ url_for('status') }}">Стан</a>
{% if session.ok %}<form method="post" action="{{ url_for('logout') }}"><input type="hidden" name="csrf" value="{{ csrf() }}"><button>Вийти</button></form>{% endif %}</nav>
<main>{% block body %}{% endblock %}</main></body></html>
