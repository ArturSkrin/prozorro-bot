<!doctype html>
<html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}Prozorro бот{% endblock %}</title>
<meta name="theme-color" content="#0f1a2c">
<link rel="icon" href="{{ asset('favicon.svg') }}" type="image/svg+xml">
<link rel="stylesheet" href="{{ asset('app.css') }}">
</head><body>
{% block shell %}
<header class="top">
<a class="brand" href="{{ url_for('found') }}"><img src="{{ asset('favicon.svg') }}" alt=""><span>Prozorro бот</span></a>
<nav class="nav" aria-label="Розділи">
{% for ep, label in [('found', 'Знайдено'), ('searches', 'Пошуки'), ('status', 'Стан')] %}
<a href="{{ url_for(ep) }}"{% if request.endpoint == ep or (ep == 'found' and request.endpoint == 'tender') or (ep == 'searches' and request.endpoint == 'search_edit') %} aria-current="page"{% endif %}>{{ icon(ep) }}{{ label }}</a>
{% endfor %}
</nav>
{% if session.ok %}<form method="post" action="{{ url_for('logout') }}"><input type="hidden" name="csrf" value="{{ csrf() }}"><button class="btn-ghost" title="Вийти">{{ icon('logout') }}<span class="lbl-text">Вийти</span></button></form>{% endif %}
</header>
<main>{% block body %}{% endblock %}</main>
{% endblock %}
</body></html>
